  </g>
  <g fill="#8b949e" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="154" y="124" font-size="15" font-weight="500">Hold</text>
    <text x="420" y="124" font-size="15" font-weight="500">Speak</text>
    <text x="686" y="124" font-size="15" font-weight="500">Release</text>
