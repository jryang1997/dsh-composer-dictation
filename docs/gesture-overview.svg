    <circle r="29" stroke="#4d6bfe" stroke-opacity=".18" stroke-width="2"/>
    <path d="M0-29a29 29 0 0 1 29 29" stroke="#4d6bfe" stroke-width="2" stroke-linecap="round"/>
    <path d="m-7-12 23 18-12 2-6 11z" fill="#4d6bfe"/>
  </g>
  <rect x="350" y="38" width="140" height="52" rx="26" fill="#8b949e" fill-opacity=".055" stroke="#8b949e" stroke-opacity=".18"/>
  <circle cx="370" cy="64" r="3.5" fill="#4d6bfe"/>
  <g stroke="#4d6bfe" stroke-width="2.5" stroke-linecap="round">
    <path d="M390 63v2m7-5v8m7-12v16m7-8v0m7-15v30m7-21v12m7-26v40m7-31v22m7-17v12m7-11v10m7-15v20m7-12v4"/>
  </g>
