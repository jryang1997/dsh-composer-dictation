<svg xmlns="http://www.w3.org/2000/svg" width="840" height="176" viewBox="0 0 840 176" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Hold to talk</title>
  <desc id="desc">An illustration of the gesture: hold, speak, release. Recognized text goes into the draft.</desc>
