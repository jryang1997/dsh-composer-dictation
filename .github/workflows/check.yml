name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs rather than version tags: a tag is a name anyone with push
      # access can move, and this workflow is the only thing standing between a bad edit
      # and main. The cost of pinning is that these need refreshing by hand — the checkout
      # pin is on v5 and the setup-node pin on v7, each the newest line still maintained.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      # No dependencies and no build step: the plugin is plain JavaScript.
      - name: Parse the host half
        run: node --check index.js
      - name: Parse the client half
        run: node --check client.js
      - name: Validate the bundle manifest
        run: node -e "const p=require('./package.json'); if(!p.dsh?.bundle?.patch) throw new Error('dsh.bundle.patch is required'); if(!p.dsh?.client) throw new Error('dsh.client is required'); console.log('manifest ok');"
      - name: Check the locale dictionaries
        run: node tests/locales.test.mjs
      - name: Render every gesture state
        run: node tests/render.test.mjs
      - name: Check live dictation and safe cancellation
        run: node tests/live.test.mjs
      - name: Check the published tarball
        run: node tests/package.test.mjs
