name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # No dependencies and no build step: the plugin is plain JavaScript.
      - name: Parse the host half
        run: node --check index.js
      - name: Parse the client half
        run: node --check client.js
      - name: Validate the bundle manifest
        run: node -e "const p=require('./package.json'); if(!p.dsh?.bundle?.patch) throw new Error('dsh.bundle.patch is required'); if(!p.dsh?.client) throw new Error('dsh.client is required'); console.log('manifest ok');"
      - name: Check the locale dictionaries
        run: node tests/locales.test.mjs
