name: Feature request
description: Suggest a change to the gesture, the surface, or how it degrades.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Describe how the change would help you use Hold to talk. Check the README and
        existing issues first to see whether the feature is already available or proposed.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: Describe the situation you are in, not the feature you have in mind. What
        are you trying to do that the plugin gets in the way of?
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Where does this belong?
      options:
        - The hold gesture (thresholds, cancel, arming)
        - The recording surface (capsule, waveform, text)
        - Accessibility (keyboard entry, screen readers, reduced motion)
        - Host compatibility (a DSH update broke something)
        - Documentation
        - Something else
    validations:
      required: true

  - type: checkboxes
    id: existing
    attributes:
      label: Checks
      options:
        - label: I read the README.
          required: true
        - label: I searched the existing issues.
          required: true
